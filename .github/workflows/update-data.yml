name: Update showtimes

# Rebuild data/showtimes.json once a day (and on demand) and commit it.
on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC ≈ 06:00 Israel
  workflow_dispatch:

# Allow the job to push the regenerated data file back to the repo.
permissions:
  contents: write

# Don't let an on-demand run collide with the scheduled one.
concurrency:
  group: update-showtimes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Exits non-zero if any provider failed, but still writes partial data
      # first and then sets the `written` output.
      - name: Fetch showtimes
        id: fetch
        run: node scripts/build-data.mjs

      # Commit whatever was written, even when the fetch step failed on provider
      # errors. Skipped if the script never wrote the file (all providers
      # failed, or it crashed), so nothing broken is committed. The job still
      # ends red because the fetch step failed.
      - name: Commit if changed
        if: ${{ !cancelled() && steps.fetch.outputs.written == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/showtimes.json
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "Update showtimes ($(date -u +%Y-%m-%d))"
            git push
          fi
