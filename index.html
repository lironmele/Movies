<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>לוח הקרנות — כל בתי הקולנוע</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0a0d;
      --panel: #141217;
      --panel-hi: #1b1820;
      --line: #2a2630;
      --text: #ece6df;
      --muted: #9a8f86;
      --amber: #ffb43d;
      --amber-soft: rgba(255, 180, 61, .14);
      --serif: "Frank Ruhl Libre", Georgia, serif;
      --sans: "Heebo", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      /* projector bloom from the top */
      background-image: radial-gradient(120% 60% at 50% -10%, rgba(255, 180, 61, .10), transparent 60%);
      background-repeat: no-repeat;
    }

    header {
      text-align: center;
      padding: 48px 16px 8px;
    }
    .eyebrow {
      font-size: .72rem;
      letter-spacing: .28em;
      text-transform: uppercase;
      color: var(--amber);
      margin: 0 0 10px;
      font-weight: 500;
    }
    header h1 {
      font-family: var(--serif);
      font-weight: 900;
      font-size: clamp(2rem, 6vw, 3.1rem);
      line-height: 1.05;
      margin: 0;
    }
    header p {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: .9rem;
      font-weight: 300;
    }

    main { max-width: 720px; margin: 0 auto; padding: 16px 16px 64px; }

    /* Search — the projector beam */
    .search {
      position: relative;
      margin: 28px 0 14px;
    }
    .search input {
      width: 100%;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px 56px 18px 20px;
      font-family: var(--sans);
      font-size: 1.15rem;
      font-weight: 400;
      outline: none;
      transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
    }
    .search input::placeholder { color: var(--muted); }
    .search input:focus {
      border-color: var(--amber);
      background: var(--panel-hi);
      box-shadow: 0 0 0 4px var(--amber-soft), 0 18px 50px -20px rgba(255, 180, 61, .5);
    }
    .search .icon {
      position: absolute;
      inset-inline-end: 20px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
      transition: color .2s ease;
    }
    .search input:focus ~ .icon { color: var(--amber); }

    [hidden] { display: none !important; }
    :focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

    /* Shared theater logo: in the picker, the movie rows and each theater line */
    .logo {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      object-fit: contain;
      background: #fff;
      padding: 1px;
      flex: none;
    }
    /* Overlapping chain logos, capped with a "+N" */
    .stack { display: inline-flex; align-items: center; }
    .stack .logo { box-shadow: 0 0 0 2px var(--panel); }
    .stack .logo + .logo { margin-inline-start: -4px; }
    .stack .more {
      margin-inline-start: 4px;
      font-size: .7rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .link {
      background: none;
      border: 0;
      padding: 2px;
      color: var(--muted);
      text-decoration: underline;
      font-family: var(--sans);
      font-size: .8rem;
      cursor: pointer;
    }
    .link:hover { color: var(--amber); }
    .quick { display: flex; gap: 6px; flex-wrap: wrap; }
    .quick button {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 3px 10px;
      font-family: var(--sans);
      font-size: .76rem;
      cursor: pointer;
    }
    .quick button:hover { color: var(--text); border-color: var(--muted); }
    .seg {
      display: inline-flex;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 2px;
      background: var(--panel);
    }
    .seg button {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 3px 12px;
      border-radius: 999px;
      font-family: var(--sans);
      font-size: .75rem;
      cursor: pointer;
    }
    .seg button.on { background: var(--amber); color: #1c1206; font-weight: 500; }

    /* "My cinemas" — one button that summarizes the choice, opening a sheet */
    .picker { margin: 22px 0 0; }
    .picker-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      max-width: 100%;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 14px 6px 10px;
      font-family: var(--sans);
      font-size: .86rem;
      cursor: pointer;
      transition: border-color .15s ease;
    }
    .picker-btn:hover, .picker-btn[aria-expanded="true"] { border-color: var(--amber); }
    .picker-btn .sub { color: var(--muted); font-size: .78rem; }
    .picker-btn .chev { color: var(--muted); font-size: .7rem; }
    /* Confirms a change of theaters on the control that owns them */
    .picker-btn.flash { animation: flash 1.2s ease-out 1; }
    @keyframes flash {
      0% { box-shadow: 0 0 0 6px var(--amber-soft); border-color: var(--amber); }
      100% { box-shadow: 0 0 0 0 transparent; }
    }
    .picker-sheet {
      margin-top: 10px;
      background: var(--panel);
      border: 1px solid var(--amber);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 24px 60px -30px rgba(255, 180, 61, .45);
    }
    .picker-head {
      padding: 12px 14px 10px;
      border-bottom: 1px solid var(--line);
      display: grid;
      gap: 10px;
    }
    .picker-head input {
      width: 100%;
      background: var(--panel-hi);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 9px 12px;
      font-family: var(--sans);
      font-size: .9rem;
      outline: none;
    }
    .picker-head input:focus { border-color: var(--amber); }
    /* The list scrolls inside the sheet; a fade + cue says there's more below */
    .picker-scroll { position: relative; }
    .picker-body {
      max-height: 360px;
      overflow-y: auto;
      padding: 4px 6px 8px;
      scrollbar-width: thin;
      scrollbar-color: var(--muted) transparent;
    }
    .picker-body::-webkit-scrollbar { width: 6px; }
    .picker-body::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 3px; }
    .scroll-cue {
      position: absolute;
      inset-inline: 0;
      bottom: 0;
      height: 56px;
      pointer-events: none;
      background: linear-gradient(to bottom, transparent, var(--panel) 75%);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 6px;
      font-size: .72rem;
      color: var(--amber);
    }
    .p-region { border-bottom: 1px solid var(--line); }
    .p-region:last-child { border-bottom: 0; }
    .p-region-head { display: flex; align-items: center; gap: 8px; padding: 2px 4px; }
    .p-region-toggle {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      background: none;
      border: 0;
      color: var(--text);
      font-family: var(--sans);
      font-size: .9rem;
      cursor: pointer;
      padding: 10px 4px;
      text-align: start;
    }
    .p-region-toggle .caret {
      color: var(--muted);
      font-size: .7rem;
      width: 10px;
      transition: transform .15s ease;
    }
    .p-region.open .p-region-toggle .caret { transform: rotate(-90deg); }
    .p-region-toggle .cnt {
      font-size: .72rem;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0 8px;
      font-variant-numeric: tabular-nums;
    }
    .p-region-toggle .cnt.some { color: var(--amber); border-color: var(--amber); }
    .p-region-all {
      background: none;
      border: 0;
      color: var(--amber);
      font-family: var(--sans);
      font-size: .74rem;
      cursor: pointer;
      padding: 4px 6px;
      flex: none;
    }
    .p-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 2px 8px;
      padding: 4px 4px 10px;
    }
    .p-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px;
      border-radius: 8px;
      font-size: .84rem;
      cursor: pointer;
      color: var(--muted);
    }
    .p-item:hover { background: var(--panel-hi); }
    .p-item.on { color: var(--text); }
    .p-item input { accent-color: var(--amber); margin: 0; width: 15px; height: 15px; flex: none; }
    .p-item .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .picker-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 14px;
      border-top: 1px solid var(--line);
      font-size: .8rem;
      color: var(--muted);
    }
    .picker-foot .left { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
    .picker-foot .tally { font-size: .76rem; font-variant-numeric: tabular-nums; }
    .picker-foot .done {
      background: var(--amber);
      color: #1c1206;
      border: 0;
      border-radius: 999px;
      padding: 7px 16px;
      font-family: var(--sans);
      font-weight: 500;
      font-size: .84rem;
      cursor: pointer;
    }

    /* First visit: the one thing to do before anything else, so it gets the beam */
    .onboard {
      margin: 18px 0 4px;
      padding: 20px 18px 16px;
      border: 1px solid var(--amber);
      border-radius: 16px;
      background: linear-gradient(var(--amber-soft), var(--amber-soft)), var(--panel);
      box-shadow: 0 0 0 4px var(--amber-soft), 0 24px 60px -24px rgba(255, 180, 61, .55);
      display: grid;
      gap: 14px;
      text-align: center;
      animation: beam 1.6s ease-out 1;
    }
    @keyframes beam {
      0% { box-shadow: 0 0 0 0 rgba(255, 180, 61, .55), 0 24px 60px -24px rgba(255, 180, 61, .55); }
      100% { box-shadow: 0 0 0 4px var(--amber-soft), 0 24px 60px -24px rgba(255, 180, 61, .55); }
    }
    .onboard h2 {
      margin: 0;
      font-family: var(--serif);
      font-weight: 700;
      font-size: 1.45rem;
      line-height: 1.2;
    }
    .onboard p { margin: 0; color: var(--muted); font-size: .86rem; }
    .onboard .quick { justify-content: center; gap: 8px; }
    .onboard .quick button {
      font-size: .92rem;
      padding: 8px 16px;
      color: var(--text);
      background: var(--panel-hi);
    }
    .onboard .quick button:hover { border-color: var(--amber); color: var(--amber); }
    .onboard .link { justify-self: center; }

    /* Day filter — single quiet scrollable strip */
    .days {
      display: flex;
      gap: 6px;
      margin: 0 0 22px;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      /* fade the trailing edge to hint at scroll */
      -webkit-mask-image: linear-gradient(to left, transparent, #000 24px);
      mask-image: linear-gradient(to left, transparent, #000 24px);
    }
    .days::-webkit-scrollbar { display: none; }
    .day-chip {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 5px 12px;
      font-family: var(--sans);
      font-size: .8rem;
      cursor: pointer;
      white-space: nowrap;
      flex: none;
      transition: color .15s ease, border-color .15s ease, background .15s ease;
    }
    .day-chip:hover { color: var(--text); border-color: var(--muted); }
    .day-chip.active {
      color: #1c1206;
      background: var(--amber);
      border-color: var(--amber);
      font-weight: 500;
    }
    .day-chip small { opacity: .75; margin-inline-start: 4px; font-size: .72rem; }

    /* Movie list (accordion) */
    .movie-list { display: flex; flex-direction: column; gap: 8px; }
    .movie-row {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      transition: border-color .15s ease;
    }
    .movie-row.active { border-color: var(--amber); }
    .movie-item {
      text-align: start;
      width: 100%;
      background: transparent;
      color: var(--text);
      border: 0;
      padding: 16px 18px;
      font-family: var(--serif);
      font-size: 1.18rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .movie-item:hover { color: var(--amber); }
    .movie-row.active .movie-item { color: var(--amber); }
    .movie-item .title {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    /* Right side of a collapsed row: next showing, a capped logo stack and the
       number of theaters, so the title keeps its room however many there are. */
    .movie-item .meta {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      flex: none;
    }
    .movie-item .next {
      font-family: var(--sans);
      font-size: .74rem;
      font-weight: 400;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .movie-item .next b { color: var(--text); font-weight: 500; }
    .movie-item .count {
      font-family: var(--sans);
      font-size: .78rem;
      font-weight: 400;
      color: var(--muted);
      flex: none;
    }
    .movie-row.active .movie-item .count { color: var(--amber); }

    /* Expanded showtimes panel */
    .movie-panel { padding: 4px 18px 16px; border-top: 1px solid var(--line); }
    .panel-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }
    .panel-bar .hint { font-size: .78rem; color: var(--muted); }
    .region-block { margin-top: 12px; }
    .region-label, .slot .label {
      font-size: .78rem;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .region-label { display: flex; align-items: center; gap: 8px; }
    .region-label::after { content: ""; flex: 1; border-top: 1px solid var(--line); }
    .slot { margin-top: 14px; }
    .show-more {
      margin-top: 8px;
      width: 100%;
      background: none;
      border: 1px dashed var(--line);
      border-radius: 8px;
      padding: 6px 12px;
      color: var(--muted);
      font-family: var(--sans);
      font-size: .8rem;
      cursor: pointer;
    }
    .show-more:hover { color: var(--amber); border-color: var(--amber); }
    /* One line per theater within a day: logo + branch name, then its times */
    .theater-line {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 6px 0;
    }
    .theater-line + .theater-line { border-top: 1px dashed var(--line); }
    .theater-line .theater {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex: none;
      width: 92px;
      min-height: 34px;
      font-size: .78rem;
      color: var(--muted);
    }
    .theater-line .theater span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .times { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
    .time {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--panel-hi);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: .92rem;
      font-variant-numeric: tabular-nums;
      color: var(--text);
      text-decoration: none;
      transition: border-color .15s ease, color .15s ease;
    }
    .time:hover { border-color: var(--amber); color: var(--amber); }
    /* Already started: still a link (late arrivals), but visibly behind us */
    .time.past { opacity: .45; text-decoration: line-through; }
    .time .where { font-size: .72rem; color: var(--muted); }
    .time.open {
      border-color: var(--amber);
      background: var(--amber-soft);
      color: var(--amber);
    }

    /* Inline booking — the ticket page opens right under the day it belongs to */
    .booking {
      margin-top: 12px;
      border: 1px solid var(--amber);
      border-radius: 10px;
      overflow: hidden;
      background: var(--panel-hi);
    }
    .booking-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      border-bottom: 1px solid var(--line);
      font-size: .78rem;
      color: var(--muted);
    }
    .booking-bar .who {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }
    .booking-bar .who span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .booking-bar .spacer { flex: 1 1 auto; }
    .booking-bar a,
    .booking-bar .close {
      flex: none;
      background: transparent;
      border: 0;
      padding: 2px 6px;
      border-radius: 6px;
      font: inherit;
      color: var(--muted);
      text-decoration: none;
      cursor: pointer;
      transition: color .15s ease;
    }
    .booking-bar a:hover,
    .booking-bar .close:hover { color: var(--amber); }
    .booking iframe {
      display: block;
      width: 100%;
      height: min(72vh, 640px);
      border: 0;
      background: #fff;
    }

    .note {
      text-align: center;
      color: var(--muted);
      padding: 56px 16px;
      font-weight: 300;
    }
    .note.error { color: #ff9d8f; }
    .note.partial {
      padding: 10px 14px;
      margin-bottom: 12px;
      font-size: .82rem;
      border: 1px solid rgba(255, 157, 143, .35);
      border-radius: 10px;
    }
    .note .skeleton-dot {
      display: inline-block;
      width: 7px; height: 7px;
      margin-inline-start: 4px;
      border-radius: 50%;
      background: var(--amber);
      animation: pulse 1s ease-in-out infinite;
    }
    .toast {
      position: fixed;
      inset-inline: 16px;
      bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      margin: 0 auto;
      max-width: 420px;
      text-align: center;
      padding: 10px 14px;
      background: var(--panel-hi);
      border: 1px solid var(--amber);
      border-radius: 10px;
      font-size: .85rem;
      z-index: 10;
    }

    @media (max-width: 480px) {
      .movie-item { padding: 14px; font-size: 1.08rem; }
      .movie-panel { padding: 4px 14px 14px; }
      .movie-item .next { display: none; }
      .p-grid { grid-template-columns: 1fr; }
    }

    @keyframes pulse { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>
  <header>
    <p id="eyebrow" class="eyebrow">כל בתי הקולנוע</p>
    <h1>מה מתחשק לכם לראות?</h1>
    <p>כל ההקרנות מכל בתי הקולנוע במקום אחד, מתעדכן ישירות מהקופות.</p>
  </header>

  <main>
    <div id="picker" class="picker"></div>
    <div id="onboard"></div>

    <div class="search">
      <input id="search" type="text" placeholder="התחילו להקליד שם של סרט…" spellcheck="false" autocomplete="off" aria-label="חיפוש סרט">
      <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.5" y2="16.5"></line></svg>
    </div>

    <div id="days" class="days"></div>

    <div id="movieList" class="movie-list"></div>
    <div id="note" class="note"><span>טוען הקרנות</span><span class="skeleton-dot"></span></div>
  </main>
  <div id="toast" class="toast" role="status" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
